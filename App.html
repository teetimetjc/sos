<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.O.S. Septic Work Order</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ── Reset & base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}
input,select,textarea,button{font:inherit}
button{cursor:pointer}

/* ── Layout ── */
#app{max-width:700px;margin:0 auto;padding:8px}
header{background:#1a4a7a;color:#fff;padding:12px 16px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.1rem;font-weight:700;letter-spacing:.3px}
.header-btns{display:flex;gap:8px}

/* ── Tabs ── */
.tab-bar{display:flex;background:#fff;border-bottom:2px solid #1a4a7a}
.tab-btn{flex:1;padding:10px 4px;border:none;background:transparent;font-weight:600;font-size:.85rem;color:#555;transition:all .15s}
.tab-btn.active{color:#1a4a7a;border-bottom:3px solid #1a4a7a;margin-bottom:-2px}

/* ── Cards / sections ── */
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.section-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#1a4a7a;margin-bottom:10px;border-bottom:1px solid #dce5f0;padding-bottom:4px}

/* ── Form fields ── */
.field{margin-bottom:10px}
.field label{display:block;font-size:.78rem;font-weight:600;color:#444;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1.5px solid #ccc;border-radius:6px;font-size:.9rem;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1a4a7a}
.field input.error,.field select.error,.field textarea.error{border-color:#c0392b}
.field textarea{min-height:60px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ── Type selector ── */
.type-toggle{display:flex;gap:8px;margin-bottom:12px}
.type-btn{flex:1;padding:10px;border:2px solid #ccc;border-radius:8px;background:#fff;font-weight:700;font-size:.9rem;color:#555;transition:all .15s}
.type-btn.active{border-color:#1a4a7a;background:#1a4a7a;color:#fff}

/* ── Lookup ── */
.lookup-row{display:flex;gap:8px;margin-bottom:10px}
.lookup-row input{flex:1;padding:9px 10px;border:1.5px solid #ccc;border-radius:6px;font-size:.9rem}
.lookup-row button{padding:9px 14px;background:#2980b9;color:#fff;border:none;border-radius:6px;font-weight:600;white-space:nowrap}
#lookupStatus{font-size:.78rem;color:#555;margin-bottom:4px;min-height:16px}

/* ── Quick picks ── */
.quickpick-label{font-size:.75rem;font-weight:600;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.quickpick-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qp-btn{padding:6px 12px;background:#eaf0fb;border:1px solid #b0c4de;border-radius:20px;font-size:.8rem;font-weight:600;color:#1a4a7a;transition:background .15s}
.qp-btn:hover{background:#c8dbf5}

/* ── Line items ── */
#lineItemsTable{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:8px}
#lineItemsTable th{background:#f0f4fa;padding:7px 6px;text-align:left;font-size:.75rem;font-weight:700;color:#555;border-bottom:2px solid #dce5f0}
#lineItemsTable td{padding:5px 4px;border-bottom:1px solid #eee;vertical-align:middle}
#lineItemsTable input{width:100%;border:1px solid #ccc;border-radius:4px;padding:5px 6px}
.del-btn{background:none;border:none;color:#c0392b;font-size:1rem;padding:2px 6px}
.total-row{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:4px}
.total-row label{font-weight:700;font-size:.9rem}
#totalDisplay{font-size:1.1rem;font-weight:700;color:#1a4a7a;min-width:80px;text-align:right}

/* ── Signature ── */
#sigCanvas{border:1.5px solid #ccc;border-radius:6px;width:100%;touch-action:none;cursor:crosshair;background:#fafafa}
.sig-controls{display:flex;gap:8px;margin-top:6px}
.sig-controls button{padding:6px 14px;border:none;border-radius:6px;font-weight:600;font-size:.82rem}
#clearSig{background:#f0f0f0;color:#555}

/* ── Buttons ── */
.btn-primary{display:block;width:100%;padding:13px;background:#1a4a7a;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:1rem;margin-top:4px;transition:background .15s}
.btn-primary:hover{background:#15396b}
.btn-primary:disabled{background:#8aabb8;cursor:not-allowed}
.btn-secondary{padding:8px 16px;background:#e8edf4;color:#1a4a7a;border:1.5px solid #b0c4de;border-radius:6px;font-weight:600;font-size:.85rem}

/* ── Error banner ── */
#errorBanner{background:#fde8e8;border:1.5px solid #e74c3c;border-radius:8px;padding:10px 14px;margin-bottom:10px;display:none}
#errorBanner ul{margin-left:16px;font-size:.85rem;color:#c0392b}
#successBanner{background:#e8f8e8;border:1.5px solid #27ae60;border-radius:8px;padding:10px 14px;margin-bottom:10px;display:none;font-size:.9rem;color:#1a6b1a;font-weight:600}

/* ── History ── */
#historyList{margin-top:8px}
.hist-card{background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:4px}
.hist-card .wo-num{font-weight:700;color:#1a4a7a;font-size:.9rem}
.hist-card .wo-meta{font-size:.78rem;color:#666}
.hist-card .wo-actions{display:flex;gap:8px;margin-top:6px}
.hist-card .wo-actions button{padding:5px 12px;font-size:.8rem;font-weight:600;border:none;border-radius:5px}
.btn-pdf{background:#2980b9;color:#fff}
.btn-view{background:#e8edf4;color:#1a4a7a;border:1px solid #b0c4de}
#historySearch{width:100%;padding:9px 10px;border:1.5px solid #ccc;border-radius:6px;font-size:.9rem;margin-bottom:10px}
#histLoading{font-size:.85rem;color:#888;padding:12px 0;text-align:center}

/* ── Spinner overlay ── */
#spinner{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9999}
#spinner .spin-box{background:#fff;border-radius:12px;padding:28px 36px;text-align:center;font-weight:600;color:#1a4a7a}
#spinner .spin-icon{font-size:2rem;animation:spin 1s linear infinite;display:block;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Util ── */
.hide{display:none!important}
.sep-only,.trap-only{transition:opacity .2s}

/* responsive tweaks */
@media(max-width:480px){
  .row2,.row3{grid-template-columns:1fr}
  header h1{font-size:.95rem}
}
</style>
</head>
<body>

<div id="spinner"><div class="spin-box"><span class="spin-icon">⚙</span>Saving…</div></div>

<div id="app">
  <header>
    <h1>S.O.S. Septic Work Orders</h1>
    <div class="header-btns">
      <button class="btn-secondary" onclick="showTab('new')" style="padding:6px 12px">+ New</button>
      <button class="btn-secondary" onclick="showTab('history')" style="padding:6px 12px">History</button>
    </div>
  </header>

  <!-- ====== NEW WORK ORDER TAB ====== -->
  <div id="tabNew">

    <!-- Type -->
    <div class="card" style="margin-top:10px">
      <div class="type-toggle">
        <button class="type-btn active" id="typeSeptic" onclick="setType('Septic')">🟦 Septic</button>
        <button class="type-btn" id="typeGrease" onclick="setType('Grease Trap')">🟩 Grease Trap</button>
      </div>

      <!-- Customer lookup -->
      <div class="section-title">Customer Lookup</div>
      <div class="lookup-row">
        <input type="tel" id="lookupPhone" placeholder="Phone number to auto-fill…">
        <button onclick="doLookup()">Lookup</button>
      </div>
      <div id="lookupStatus"></div>
    </div>

    <!-- Bill To / Contact -->
    <div class="card">
      <div class="section-title">Bill To &amp; Contact</div>
      <div class="field">
        <label>Bill To *</label>
        <input type="text" id="billTo" placeholder="Name / company">
      </div>
      <div class="field">
        <label>Job / Service Address *</label>
        <input type="text" id="job" placeholder="Street address">
      </div>
      <div class="row2">
        <div class="field"><label>Phone 1</label><input type="tel" id="phone1" placeholder="Primary phone"></div>
        <div class="field"><label>Phone 2</label><input type="tel" id="phone2" placeholder="Secondary phone"></div>
      </div>
    </div>

    <!-- Job details -->
    <div class="card">
      <div class="section-title">Job Details</div>
      <div class="row2">
        <div class="field"><label>Date *</label><input type="date" id="date"></div>
        <div class="field"><label>Time</label><input type="time" id="time"></div>
      </div>
      <div class="field">
        <label>Technician *</label>
        <input type="text" id="technician" placeholder="Tech name">
      </div>

      <!-- Septic-only fields -->
      <div class="sep-only">
        <div class="row2">
          <div class="field"><label>Pump Type</label>
            <select id="pumpType">
              <option value="">— select —</option>
              <option>Single Compartment</option>
              <option>Dual Compartment</option>
              <option>Lift Station</option>
            </select>
          </div>
          <div class="field"><label>Year Built</label><input type="number" id="yearBuilt" placeholder="e.g. 1998"></div>
        </div>
        <div class="row3">
          <div class="field"><label>Water Level</label><input type="text" id="waterLevel" placeholder='e.g. 12"'></div>
          <div class="field"><label>Scum</label><input type="text" id="scum" placeholder='inches'></div>
          <div class="field"><label>Sludge</label><input type="text" id="sludge" placeholder='inches'></div>
        </div>
        <div class="row3">
          <div class="field"><label>Tank Sound</label>
            <select id="tankSound">
              <option value="">—</option>
              <option>Good</option>
              <option>Fair</option>
              <option>Poor</option>
            </select>
          </div>
          <div class="field"><label>Compartment</label>
            <select id="compartment">
              <option value="">—</option>
              <option>1</option>
              <option>2</option>
            </select>
          </div>
          <div class="field"><label>Outlet T</label>
            <select id="outletT">
              <option value="">—</option>
              <option>Present</option>
              <option>Missing</option>
              <option>Damaged</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>Material</label>
            <select id="material">
              <option value="">—</option>
              <option>Concrete</option>
              <option>Fiberglass</option>
              <option>Poly</option>
              <option>Steel</option>
            </select>
          </div>
          <div class="field"><label>Drainfield Location</label><input type="text" id="drainfield" placeholder="Description / notes"></div>
        </div>
      </div>

      <!-- Grease Trap-only fields -->
      <div class="trap-only hide">
        <div class="field"><label>Trap Location / Description</label><input type="text" id="trapLocation" placeholder="Location or description"></div>
      </div>

      <div class="field"><label>Pumpout Ordered</label>
        <select id="pumpoutOrdered">
          <option value="">—</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>
      <div class="field"><label>Directions / Notes</label><textarea id="directions" placeholder="Access notes, gate codes, etc."></textarea></div>
      <div class="row2">
        <div class="field"><label>Schedule</label><input type="text" id="schedule" placeholder="e.g. Every 6 months"></div>
        <div class="field"><label>LPO #</label><input type="text" id="lpo"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Next Pump Date</label><input type="date" id="nextPump"></div>
        <div class="field"><label>Special Notes</label><input type="text" id="specialNotes"></div>
      </div>
    </div>

    <!-- Line Items -->
    <div class="card">
      <div class="section-title">Services &amp; Line Items *</div>
      <div class="quickpick-label">Quick add:</div>
      <div class="quickpick-btns">
        <button class="qp-btn" onclick="addLineItem('Septic Tank Pumpout')">Septic Tank</button>
        <button class="qp-btn" onclick="addLineItem('Grease Trap Pumpout')">Grease Trap</button>
        <button class="qp-btn" onclick="addLineItem('Lift Station')">Lift Station</button>
        <button class="qp-btn" onclick="addLineItem('Service Call')">Service Call</button>
        <button class="qp-btn" onclick="addLineItem('Jetter Service')">Jetter</button>
        <button class="qp-btn" onclick="addLineItem('Camera Inspection')">Camera</button>
        <button class="qp-btn" onclick="addLineItem('Bio-Clean Treatment')">Bio-Clean</button>
        <button class="qp-btn" onclick="addLineItem('Parts / Materials')">Parts</button>
        <button class="qp-btn" onclick="addLineItem('Other')">Other</button>
      </div>

      <table id="lineItemsTable">
        <thead>
          <tr>
            <th style="width:44%">Description</th>
            <th style="width:22%">Gallons</th>
            <th style="width:24%">Amount ($)</th>
            <th style="width:10%"></th>
          </tr>
        </thead>
        <tbody id="lineItemsBody"></tbody>
      </table>
      <button class="btn-secondary" onclick="addLineItem('')" style="font-size:.8rem;padding:6px 12px">+ Add Row</button>
      <div class="total-row">
        <label>Total:</label>
        <span id="totalDisplay">$0.00</span>
      </div>
    </div>

    <!-- Payment -->
    <div class="card">
      <div class="section-title">Payment</div>
      <div class="row2">
        <div class="field"><label>Billing</label>
          <select id="billing">
            <option value="">— select —</option>
            <option>Cash</option>
            <option>Check</option>
            <option>Credit Card</option>
            <option>Invoice / Net 30</option>
            <option>COD</option>
          </select>
        </div>
        <div class="field"><label>Terms</label>
          <select id="terms">
            <option value="">— select —</option>
            <option>Due on receipt</option>
            <option>Net 15</option>
            <option>Net 30</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>Check #</label><input type="text" id="checkNum"></div>
        <div class="field"><label>Payment Amount</label><input type="number" id="paymentAmt" step="0.01" min="0" placeholder="0.00"></div>
      </div>
      <div class="field"><label>Comments</label><textarea id="comments" placeholder="Additional payment or service notes…"></textarea></div>
    </div>

    <!-- Signature -->
    <div class="card">
      <div class="section-title">Signature</div>
      <canvas id="sigCanvas" height="130"></canvas>
      <div class="sig-controls">
        <button id="clearSig" onclick="clearSignature()">Clear</button>
      </div>
      <div class="field" style="margin-top:10px">
        <label>Printed Name (required) *</label>
        <input type="text" id="signedBy" placeholder="Customer printed name">
      </div>
    </div>

    <!-- Save -->
    <div id="errorBanner"><ul id="errorList"></ul></div>
    <div id="successBanner" id="successMsg"></div>
    <button class="btn-primary" id="saveBtn" onclick="saveWorkOrder()">Save Work Order</button>
    <div style="height:20px"></div>

  </div><!-- /tabNew -->

  <!-- ====== HISTORY TAB ====== -->
  <div id="tabHistory" class="hide" style="margin-top:10px">
    <div class="card">
      <div class="section-title">Work Order History</div>
      <input type="text" id="historySearch" placeholder="Search by name, WO#, address…" oninput="filterHistory()">
      <div id="histLoading">Loading…</div>
      <div id="historyList"></div>
    </div>
  </div>

</div><!-- /app -->

<script>
// ── Secret injected server-side ──
var SECRET = '<?= secret ?>';

// ── App state ──
var currentType = 'Septic';
var sigPad = { drawing: false, lastX: 0, lastY: 0 };
var allOrders = [];

// ── Signature canvas ──
var canvas, ctx;
window.addEventListener('load', function() {
  canvas = document.getElementById('sigCanvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); startDraw(e.touches[0]); }, {passive:false});
  canvas.addEventListener('touchmove', function(e){ e.preventDefault(); draw(e.touches[0]); }, {passive:false});
  canvas.addEventListener('touchend', endDraw);

  // Set today's date
  document.getElementById('date').valueAsDate = new Date();

  // Set canvas line style
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1a1a1a';
});

window.addEventListener('resize', resizeCanvas);

function resizeCanvas() {
  if (!canvas) return;
  var w = canvas.offsetWidth;
  canvas.width = w;
  canvas.height = 130;
  if (ctx) { ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a1a1a'; }
}

function getPos(evt) {
  var r = canvas.getBoundingClientRect();
  return { x: evt.clientX - r.left, y: evt.clientY - r.top };
}
function startDraw(evt) { sigPad.drawing = true; var p = getPos(evt); sigPad.lastX = p.x; sigPad.lastY = p.y; }
function draw(evt) {
  if (!sigPad.drawing) return;
  var p = getPos(evt);
  ctx.beginPath(); ctx.moveTo(sigPad.lastX, sigPad.lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
  sigPad.lastX = p.x; sigPad.lastY = p.y;
}
function endDraw() { sigPad.drawing = false; }
function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
function isSignatureEmpty() {
  var d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (var i = 3; i < d.length; i += 4) { if (d[i] > 0) return false; }
  return true;
}

// ── Type toggle ──
function setType(t) {
  currentType = t;
  document.getElementById('typeSeptic').classList.toggle('active', t === 'Septic');
  document.getElementById('typeGrease').classList.toggle('active', t === 'Grease Trap');
  document.querySelectorAll('.sep-only').forEach(function(el){ el.classList.toggle('hide', t !== 'Septic'); });
  document.querySelectorAll('.trap-only').forEach(function(el){ el.classList.toggle('hide', t !== 'Grease Trap'); });
}

// ── Tab navigation ──
function showTab(which) {
  document.getElementById('tabNew').classList.toggle('hide', which !== 'new');
  document.getElementById('tabHistory').classList.toggle('hide', which !== 'history');
  if (which === 'history') loadHistory();
}

// ── Customer lookup ──
function doLookup() {
  var phone = document.getElementById('lookupPhone').value.trim();
  if (!phone) { setLookupStatus('Enter a phone number first.', '#c0392b'); return; }
  setLookupStatus('Searching…', '#888');

  fetch(window.location.href + '?action=lookup&secret=' + encodeURIComponent(SECRET) + '&phone=' + encodeURIComponent(phone))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (!data.ok) { setLookupStatus('Error: ' + data.error, '#c0392b'); return; }
      if (!data.customer) { setLookupStatus('No matching customer found.', '#888'); return; }
      var c = data.customer;
      fillIfEmpty('billTo', c.billTo);
      fillIfEmpty('job', c.job);
      fillIfEmpty('phone1', c.phone1);
      fillIfEmpty('phone2', c.phone2);
      fillIfEmpty('material', c.material);
      fillIfEmpty('compartment', c.compartment);
      fillIfEmpty('outletT', c.outletT);
      fillIfEmpty('tankSound', c.tankSound);
      fillIfEmpty('drainfield', c.drainfield);
      fillIfEmpty('trapLocation', c.trapLocation);
      fillIfEmpty('yearBuilt', c.yearBuilt);
      fillIfEmpty('pumpType', c.pumpType);
      setLookupStatus('Customer details filled in.', '#27ae60');
    })
    .catch(function(){ setLookupStatus('Network error. Try again.', '#c0392b'); });
}

function fillIfEmpty(id, val) {
  if (!val) return;
  var el = document.getElementById(id);
  if (!el) return;
  if (!el.value) el.value = val;
}
function setLookupStatus(msg, color) {
  var el = document.getElementById('lookupStatus');
  el.textContent = msg; el.style.color = color;
}

// ── Line items ──
var lineItemCounter = 0;
function addLineItem(label) {
  var id = ++lineItemCounter;
  var tbody = document.getElementById('lineItemsBody');
  var tr = document.createElement('tr');
  tr.id = 'li-' + id;
  tr.innerHTML =
    '<td><input type="text" value="' + escHtml(label) + '" placeholder="Description" oninput="calcTotal()"></td>' +
    '<td><input type="number" placeholder="—" min="0" step="1" oninput="calcTotal()"></td>' +
    '<td><input type="number" placeholder="0.00" min="0" step="0.01" oninput="calcTotal()"></td>' +
    '<td><button class="del-btn" onclick="removeLineItem(' + id + ')">✕</button></td>';
  tbody.appendChild(tr);
  calcTotal();
}
function removeLineItem(id) {
  var el = document.getElementById('li-' + id);
  if (el) el.remove();
  calcTotal();
}
function calcTotal() {
  var rows = document.querySelectorAll('#lineItemsBody tr');
  var sum = 0;
  rows.forEach(function(r) {
    var inputs = r.querySelectorAll('input');
    var amt = parseFloat(inputs[2].value) || 0;
    sum += amt;
  });
  document.getElementById('totalDisplay').textContent = '$' + sum.toFixed(2);
  return sum;
}
function getLineItems() {
  var items = [];
  document.querySelectorAll('#lineItemsBody tr').forEach(function(r) {
    var inputs = r.querySelectorAll('input');
    var amt = parseFloat(inputs[2].value) || 0;
    if (amt > 0 || inputs[0].value.trim()) {
      items.push({ label: inputs[0].value.trim(), gallons: inputs[1].value.trim(), amount: inputs[2].value.trim() });
    }
  });
  return items;
}
function hasValidLineItem() {
  var items = getLineItems();
  return items.some(function(it){ return parseFloat(it.amount) > 0; });
}

// ── Validation ──
function validate() {
  var errors = [];
  var fields = [
    { id: 'date', label: 'Date' },
    { id: 'billTo', label: 'Bill To' },
    { id: 'job', label: 'Job / Address' },
    { id: 'technician', label: 'Technician' },
    { id: 'signedBy', label: 'Printed Name (Signed By)' }
  ];
  // Clear previous errors
  document.querySelectorAll('.error').forEach(function(el){ el.classList.remove('error'); });

  fields.forEach(function(f) {
    var el = document.getElementById(f.id);
    if (!el || !el.value.trim()) {
      errors.push(f.label + ' is required.');
      if (el) el.classList.add('error');
    }
  });
  if (!hasValidLineItem()) {
    errors.push('At least one line item with a positive dollar amount is required.');
  }
  return errors;
}

// ── Save ──
function saveWorkOrder() {
  var errors = validate();
  var errBanner = document.getElementById('errorBanner');
  var errList = document.getElementById('errorList');
  var succBanner = document.getElementById('successBanner');

  if (errors.length) {
    errList.innerHTML = errors.map(function(e){ return '<li>' + escHtml(e) + '</li>'; }).join('');
    errBanner.style.display = 'block';
    succBanner.style.display = 'none';
    errBanner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  errBanner.style.display = 'none';

  var total = calcTotal();
  var payload = {
    secret: SECRET,
    type: currentType,
    date: v('date'), time: v('time'),
    billTo: v('billTo'), job: v('job'),
    phone1: v('phone1'), phone2: v('phone2'),
    pumpoutOrdered: v('pumpoutOrdered'),
    technician: v('technician'),
    pumpType: v('pumpType'), yearBuilt: v('yearBuilt'),
    waterLevel: v('waterLevel'), drainfield: v('drainfield'),
    scum: v('scum'), sludge: v('sludge'),
    tankSound: v('tankSound'), compartment: v('compartment'),
    outletT: v('outletT'), material: v('material'),
    trapLocation: v('trapLocation'),
    directions: v('directions'), schedule: v('schedule'),
    lpo: v('lpo'), nextPump: v('nextPump'), specialNotes: v('specialNotes'),
    lineItems: getLineItems(),
    total: total.toFixed(2),
    billing: v('billing'), terms: v('terms'),
    checkNum: v('checkNum'), paymentAmt: v('paymentAmt'),
    comments: v('comments'),
    signedBy: v('signedBy')
  };

  document.getElementById('spinner').style.display = 'flex';
  document.getElementById('saveBtn').disabled = true;

  fetch(window.location.href, {
    method: 'POST',
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(data) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('saveBtn').disabled = false;
    if (!data.ok) {
      errList.innerHTML = '<li>' + escHtml(data.error || 'Unknown error') + '</li>';
      errBanner.style.display = 'block';
      return;
    }
    var woNum = data.woNumber;
    succBanner.textContent = 'Saved! Work Order ' + woNum + ' created successfully.';
    succBanner.style.display = 'block';
    succBanner.scrollIntoView({ behavior: 'smooth' });

    // Offer PDF download
    generatePdf(payload, woNum);
    resetForm();
  })
  .catch(function(err) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('saveBtn').disabled = false;
    errList.innerHTML = '<li>Network error: ' + escHtml(err.message) + '</li>';
    errBanner.style.display = 'block';
  });
}

function v(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function resetForm() {
  // Clear text/number/select fields
  var ids = ['billTo','job','phone1','phone2','pumpoutOrdered','technician','pumpType',
    'yearBuilt','waterLevel','drainfield','scum','sludge','tankSound','compartment',
    'outletT','material','trapLocation','directions','schedule','lpo','nextPump',
    'specialNotes','billing','terms','checkNum','paymentAmt','comments','signedBy','lookupPhone'];
  ids.forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('date').valueAsDate = new Date();
  document.getElementById('time').value = '';
  document.getElementById('lineItemsBody').innerHTML = '';
  lineItemCounter = 0;
  calcTotal();
  clearSignature();
  document.getElementById('lookupStatus').textContent = '';
  setType('Septic');
}

// ── PDF generation ──
function generatePdf(data, woNum) {
  var doc = new jspdf.jsPDF({ unit: 'pt', format: 'letter' });
  var lm = 50, rm = 562, y = 50, lineH = 18;

  function line(label, val, x1, x2) {
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text(label, x1, y);
    doc.setFont('helvetica','normal'); doc.text(String(val||''), x2, y);
    y += lineH;
  }
  function section(title) {
    y += 6;
    doc.setFillColor(26,74,122); doc.rect(lm, y-12, rm-lm, 16, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(title, lm+4, y); doc.setTextColor(0,0,0); y += 8;
  }

  // Header
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.setTextColor(26,74,122);
  doc.text('S.O.S. Septic, Inc.', lm, y); y += 22;
  doc.setFontSize(10); doc.setTextColor(80,80,80);
  doc.text('sosseptic.com  •  Englewood, FL', lm, y); y += 16;
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(0,0,0);
  doc.text((data.type || 'Septic') + ' Work Order', lm, y);
  doc.setFontSize(12); doc.text(woNum, rm - doc.getTextWidth(woNum), y);
  y += 22;
  doc.setDrawColor(180,180,180); doc.line(lm, y, rm, y); y += 14;

  // Customer
  section('Customer & Job Information');
  line('Bill To:', data.billTo, lm, lm+80);
  line('Job Address:', data.job, lm, lm+80);
  line('Phone 1:', data.phone1, lm, lm+80);
  line('Phone 2:', data.phone2, lm, lm+80);

  // Job details
  section('Job Details');
  var col2 = (lm + rm) / 2 + 10;
  var savedY = y;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Date:', lm, y); doc.setFont('helvetica','normal'); doc.text(data.date||'', lm+40, y);
  doc.setFont('helvetica','bold'); doc.text('Time:', col2, y); doc.setFont('helvetica','normal'); doc.text(data.time||'', col2+40, y);
  y += lineH;
  doc.setFont('helvetica','bold'); doc.text('Technician:', lm, y); doc.setFont('helvetica','normal'); doc.text(data.technician||'', lm+70, y);
  y += lineH;

  if (data.type === 'Septic') {
    doc.setFont('helvetica','bold'); doc.text('Pump Type:', lm, y); doc.setFont('helvetica','normal'); doc.text(data.pumpType||'', lm+70, y);
    doc.setFont('helvetica','bold'); doc.text('Year Built:', col2, y); doc.setFont('helvetica','normal'); doc.text(String(data.yearBuilt||''), col2+60, y); y += lineH;
    doc.setFont('helvetica','bold'); doc.text('Water Level:', lm, y); doc.setFont('helvetica','normal'); doc.text(data.waterLevel||'', lm+75, y);
    doc.setFont('helvetica','bold'); doc.text('Scum:', col2, y); doc.setFont('helvetica','normal'); doc.text(data.scum||'', col2+35, y); y += lineH;
    doc.setFont('helvetica','bold'); doc.text('Sludge:', lm, y); doc.setFont('helvetica','normal'); doc.text(data.sludge||'', lm+45, y);
    doc.setFont('helvetica','bold'); doc.text('Tank Sound:', col2, y); doc.setFont('helvetica','normal'); doc.text(data.tankSound||'', col2+65, y); y += lineH;
    doc.setFont('helvetica','bold'); doc.text('Compartment:', lm, y); doc.setFont('helvetica','normal'); doc.text(data.compartment||'', lm+78, y);
    doc.setFont('helvetica','bold'); doc.text('Outlet T:', col2, y); doc.setFont('helvetica','normal'); doc.text(data.outletT||'', col2+50, y); y += lineH;
    doc.setFont('helvetica','bold'); doc.text('Material:', lm, y); doc.setFont('helvetica','normal'); doc.text(data.material||'', lm+55, y);
    doc.setFont('helvetica','bold'); doc.text('Drainfield:', col2, y); doc.setFont('helvetica','normal'); doc.text(data.drainfield||'', col2+60, y); y += lineH;
  } else {
    doc.setFont('helvetica','bold'); doc.text('Trap Location:', lm, y); doc.setFont('helvetica','normal'); doc.text(data.trapLocation||'', lm+82, y); y += lineH;
  }

  if (data.directions) {
    doc.setFont('helvetica','bold'); doc.text('Directions:', lm, y); y += lineH;
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    var lines = doc.splitTextToSize(data.directions, rm-lm-10);
    doc.text(lines, lm+10, y); y += lines.length * 13;
    doc.setFontSize(9);
  }

  // Line Items
  section('Services & Charges');
  var colW = [260, 80, 90, 80];
  var hdrs = ['Description', 'Gallons', 'Amount', ''];
  var cx = lm;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  hdrs.forEach(function(h,i){ doc.text(h, cx, y); cx += colW[i]; });
  y += 4; doc.setDrawColor(200,200,200); doc.line(lm, y, rm, y); y += 12;
  doc.setFont('helvetica','normal');
  (data.lineItems||[]).forEach(function(it) {
    cx = lm;
    doc.text(String(it.label||''), cx, y); cx += colW[0];
    doc.text(String(it.gallons||''), cx, y); cx += colW[1];
    var amtStr = it.amount ? '$'+parseFloat(it.amount).toFixed(2) : '';
    doc.text(amtStr, cx, y);
    y += lineH;
  });
  y += 4; doc.line(lm, y, rm, y); y += 14;
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  var totalStr = 'Total: $' + (parseFloat(data.total)||0).toFixed(2);
  doc.text(totalStr, rm - doc.getTextWidth(totalStr), y); y += 22;

  // Payment
  section('Payment');
  doc.setFontSize(9);
  line('Billing:', data.billing, lm, lm+55);
  line('Terms:', data.terms, lm, lm+55);
  if (data.checkNum) line('Check #:', data.checkNum, lm, lm+55);
  if (data.paymentAmt) line('Payment:', '$'+data.paymentAmt, lm, lm+55);
  if (data.comments) {
    doc.setFont('helvetica','bold'); doc.text('Comments:', lm, y); y += lineH;
    doc.setFont('helvetica','normal');
    var cl = doc.splitTextToSize(data.comments, rm-lm-10);
    doc.text(cl, lm+10, y); y += cl.length * 13;
  }

  // Signature area
  y += 10;
  if (y > 680) { doc.addPage(); y = 50; }
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Customer Signature:', lm, y); y += 8;
  // Embed signature if present
  if (!isSignatureEmpty()) {
    var sigData = canvas.toDataURL('image/png');
    doc.addImage(sigData, 'PNG', lm, y, 200, 60);
    y += 68;
  } else {
    doc.setDrawColor(180); doc.rect(lm, y, 200, 55); y += 63;
  }
  doc.line(lm, y, lm+200, y); y += 14;
  doc.text('Printed Name: ' + (data.signedBy||''), lm, y); y += lineH;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
  doc.text('S.O.S. Septic, Inc. — sosseptic.com — Englewood, FL', lm, y);

  doc.save(woNum + '_' + (data.billTo||'WO').replace(/[^a-zA-Z0-9]/g,'_') + '.pdf');
}

// ── History ──
function loadHistory() {
  document.getElementById('histLoading').textContent = 'Loading…';
  document.getElementById('historyList').innerHTML = '';
  fetch(window.location.href + '?action=list&secret=' + encodeURIComponent(SECRET))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      document.getElementById('histLoading').textContent = '';
      if (!data.ok) { document.getElementById('histLoading').textContent = 'Error: ' + data.error; return; }
      allOrders = data.orders || [];
      renderHistory(allOrders);
    })
    .catch(function(){ document.getElementById('histLoading').textContent = 'Network error.'; });
}

function filterHistory() {
  var q = document.getElementById('historySearch').value.toLowerCase();
  if (!q) { renderHistory(allOrders); return; }
  var filtered = allOrders.filter(function(o) {
    return JSON.stringify(o).toLowerCase().indexOf(q) !== -1;
  });
  renderHistory(filtered);
}

function renderHistory(orders) {
  var list = document.getElementById('historyList');
  if (!orders.length) { list.innerHTML = '<p style="color:#888;font-size:.85rem;text-align:center;padding:16px">No records found.</p>'; return; }
  list.innerHTML = orders.map(function(o) {
    var woNum = o['WO Number'] || '—';
    var billTo = o['Bill To'] || '—';
    var date = o['Date'] || '';
    var type = o['Type'] || '';
    var total = o['Total'] ? '$'+parseFloat(o['Total']).toFixed(2) : '';
    return '<div class="hist-card">' +
      '<div class="wo-num">' + escHtml(woNum) + ' <span style="font-weight:400;color:#888;font-size:.8rem">— ' + escHtml(type) + '</span></div>' +
      '<div class="wo-meta">' + escHtml(billTo) + ' &nbsp;|&nbsp; ' + escHtml(date) + (total ? ' &nbsp;|&nbsp; ' + escHtml(total) : '') + '</div>' +
      '<div class="wo-actions">' +
        '<button class="btn-pdf" onclick="reprintPdf(' + JSON.stringify(JSON.stringify(o)) + ')">PDF</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function reprintPdf(jsonStr) {
  var o = JSON.parse(jsonStr);
  var data = {
    type: o['Type'], date: o['Date'], time: o['Time'],
    billTo: o['Bill To'], job: o['Job'], phone1: o['Phone 1'], phone2: o['Phone 2'],
    pumpoutOrdered: o['Pumpout Ordered'], technician: o['Technician'],
    pumpType: o['Pump Type'], yearBuilt: o['Year Built'], waterLevel: o['Water Level'],
    drainfield: o['Drainfield'], scum: o['Scum'], sludge: o['Sludge'],
    tankSound: o['Tank Sound'], compartment: o['Compartment'], outletT: o['Outlet T'],
    material: o['Material'], trapLocation: o['Trap Location'],
    directions: o['Directions'], schedule: o['Schedule'], lpo: o['LPO'],
    nextPump: o['Next Pump'], specialNotes: o['Special Notes'],
    lineItems: safeParseJson(o['Line Items JSON']),
    total: o['Total'], billing: o['Billing'], terms: o['Terms'],
    checkNum: o['Check Num'], paymentAmt: o['Payment Amt'],
    comments: o['Comments'], signedBy: o['Signed By']
  };
  generatePdf(data, o['WO Number'] || 'WO');
}

function safeParseJson(s) {
  try { return JSON.parse(s); } catch(e) { return []; }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
